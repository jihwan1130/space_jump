<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>SPACE JUMP — 우주 점프</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#05060f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    -webkit-tap-highlight-color: transparent; touch-action: none; user-select:none;
  }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; touch-action:none; box-shadow:0 0 80px rgba(80,120,255,.15); }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
'use strict';

// ───────────────────────────────────────── 기본 설정
const W = 480, H = 854;              // 논리 해상도
const PLANETS_PER_STAGE = 8;         // 스테이지당 행성 수
const PLAYER_R = 11;
const FLIGHT_TIMEOUT = 2.6;          // 이 시간 안에 착지 못하면 우주 미아
const CAM_ANCHOR = 0.78;             // 착지한 행성이 놓이는 화면 세로 위치 (아래쪽)
const CAM_FLY = 0.62;                // 비행 중 카메라가 따라붙는 위치
const HAZARD_STAGE = 4;              // 목성부터 화면이 스스로 계속 위로 올라간다
const ORBIT_SPIN = 2.0;              // 우주선 공전(자전) 속도 배율
const COMBO_WINDOW = 3.4;            // 이 시간 안에 다음 행성을 잡으면 콤보 유지

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = Math.round(W * scale) + 'px';
  canvas.style.height = Math.round(H * scale) + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ───────────────────────────────────────── 유틸
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;

// ───────────────────────────────────────── 행성 테마 (스테이지별)
const STAGES = [
  { name:'지구',   sub:'EARTH',    c1:'#6fd7ff', c2:'#1a5fae', ac:'#7dffb0', type:'terra' },
  { name:'달',     sub:'MOON',     c1:'#ececf4', c2:'#7d7d8c', ac:'#cfd3e0', type:'rock'  },
  { name:'화성',   sub:'MARS',     c1:'#ffa268', c2:'#9c331a', ac:'#ffcf9e', type:'rock'  },
  { name:'목성',   sub:'JUPITER',  c1:'#f7dcae', c2:'#a06a35', ac:'#ffe9c4', type:'gas'   },
  { name:'토성',   sub:'SATURN',   c1:'#ffe7ac', c2:'#b0802f', ac:'#ffd98a', type:'ringed'},
  { name:'천왕성', sub:'URANUS',   c1:'#bdf7f2', c2:'#2f9d97', ac:'#d8fffb', type:'gas'   },
  { name:'해왕성', sub:'NEPTUNE',  c1:'#8fb4ff', c2:'#1d3a99', ac:'#b9cbff', type:'gas'   },
  { name:'명왕성', sub:'PLUTO',    c1:'#f3e9dc', c2:'#7f6f60', ac:'#fff6e8', type:'rock'  },
  { name:'외계행성', sub:'EXOPLANET', c1:'#e6b3ff', c2:'#5f18ad', ac:'#f3d6ff', type:'gas' },
];

// 색 유틸: hex / hsl() 문자열을 모두 HSL로 파싱
function parseColor(str) {
  if (str[0] === '#') {
    const n = parseInt(str.slice(1), 16);
    let r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    let h = 0, s = 0; const l = (mx + mn) / 2;
    if (mx !== mn) {
      const d = mx - mn;
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return { h, s: s * 100, l: l * 100 };
  }
  const m = str.match(/hsla?\(([-\d.]+)[,\s]+([\d.]+)%[,\s]+([\d.]+)%/);
  return m ? { h: +m[1], s: +m[2], l: +m[3] } : { h: 0, s: 0, l: 60 };
}
const hsl = (c) => `hsl(${((c.h % 360) + 360) % 360},${clamp(c.s, 0, 100)}%,${clamp(c.l, 0, 100)}%)`;

// 같은 스테이지 안에서도 행성마다 색을 조금씩 다르게
function varyPalette(info, hueShift, lightShift) {
  const f = (str) => {
    const c = parseColor(str);
    return hsl({ h: c.h + hueShift, s: c.s, l: c.l + lightShift });
  };
  return { c1: f(info.c1), c2: f(info.c2), ac: f(info.ac) };
}

function stageInfo(stage) {
  if (stage <= STAGES.length) return STAGES[stage - 1];
  const h = (stage * 47) % 360;
  return {
    name: `심우주 ${stage - STAGES.length}`,
    sub: 'DEEP SPACE',
    c1: `hsl(${h},85%,72%)`, c2: `hsl(${(h + 30) % 360},70%,32%)`, ac: `hsl(${h},100%,85%)`,
    type: ['gas','rock','ringed','terra'][stage % 4],
  };
}

// 스테이지별 난이도 곡선
function diff(stage) {
  const t = clamp((stage - 1) / 9, 0, 1);   // 10스테이지에 걸쳐 최대 난이도
  const t2 = clamp((stage - 10) / 15, 0, 1); // 그 이후 추가 상승
  return {
    r:      lerp(49, 27, t) - t2 * 3,
    ring:   lerp(94, 61, t) - t2 * 5,
    spin:   lerp(1.5, 2.7, t) + t2 * 0.8,
    gap:    lerp(315, 395, t) + t2 * 30,
    spread: lerp(75, 165, t),
    speed:  lerp(450, 560, t) + t2 * 40,
    // 화면이 저절로 위로 올라가는 속도 (px/s) — 아래로 밀려나면 끝
    scroll: lerp(22, 50, clamp((stage - HAZARD_STAGE) / 8, 0, 1)) + t2 * 10,
    obstacleChance: stage >= 2 ? Math.min(0.6, (stage - 1) * 0.13) : 0,
    moveChance:     stage >= 3 ? Math.min(0.55, (stage - 2) * 0.13) : 0,
    decayChance:    stage >= 5 ? Math.min(0.45, (stage - 4) * 0.14) : 0,
    decayTime:      lerp(3.4, 2.0, t),
  };
}

// ───────────────────────────────────────── 사운드 (초경량 신스)
const sfx = {
  ctx: null, on: true,
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } },
  play(freq, dur, type = 'sine', vol = 0.14, slide = 0) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  // 잡음 버스트 (화면 조정 지지직)
  noise(dur = 0.12, vol = 0.09, lp = 1200) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.ctx.destination);
    src.start(t);
  },
  jump()  { this.play(520, 0.14, 'triangle', 0.12, 260); this.noise(0.09, 0.05, 900); },
  // 콤보가 쌓일수록 음이 올라가는 펜타토닉 사다리
  land(combo = 1, perfect = false) {
    const steps = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
    const f = 330 * Math.pow(2, steps[Math.min(steps.length - 1, combo - 1)] / 12);
    this.play(f, 0.17, 'triangle', 0.13, f * 0.2);
    setTimeout(() => this.play(f * 1.5, 0.13, 'sine', 0.075), 55);
    if (perfect) { setTimeout(() => this.play(f * 2, 0.2, 'sine', 0.085, f * 0.6), 20); }
  },
  praise(){ this.play(880, 0.1, 'square', 0.07, 300); setTimeout(() => this.play(1320, 0.16, 'square', 0.06, 260), 80); },
  stage() { this.play(440, 0.12, 'square', 0.1, 200); setTimeout(() => this.play(660, 0.22, 'square', 0.1, 160), 110); setTimeout(() => this.play(880, 0.3, 'square', 0.09, 200), 230); },
  warn()  { this.play(150, 0.11, 'square', 0.055, -40); },
  die()   { this.play(220, 0.45, 'sawtooth', 0.13, -170); this.noise(0.5, 0.12, 2600); },
};

// ───────────────────────────────────────── 상태
const state = {
  mode: 'title',           // title | play | over
  planets: [],
  player: null,
  camY: 0,
  score: 0,
  best: +(localStorage.getItem('spacejump_best') || 0),
  stage: 1,
  scrolling: false,        // 화면이 스스로 위로 올라가는 중인가
  danger: 0,               // 우주선이 화면 아래 끝에 얼마나 가까운가 (0~1)
  warnT: 0,                // 근접 경고음 쿨다운
  banner: null,            // {text, sub, warn, t}
  particles: [],
  pops: [],                // 떠오르는 점수/칭찬 텍스트
  rings: [],               // 착지 충격파
  combo: 0, comboT: 0, bestCombo: 0,
  scorePop: 0,             // HUD 점수 튀는 연출
  pulse: null,             // {a, max, color} 착지 시 화면 가장자리 발광
  landed: 0,               // 밟은 행성 수
  stars: [],
  shake: 0,
  overT: 0,
  deathMsg: '',
  flash: 0,
};

function makeStars() {
  state.stars = [];
  for (let i = 0; i < 220; i++) {
    state.stars.push({
      x: rand(0, W), y: rand(0, H * 2),
      z: rand(0.15, 1),                 // 시차(parallax) 계수
      s: rand(0.5, 1.7),
      tw: rand(0, TAU),
    });
  }
}
makeStars();

// ───────────────────────────────────────── 행성 생성
let planetSeq = 0;

function createPlanet(index, x, y) {
  const stage = Math.floor(index / PLANETS_PER_STAGE) + 1;
  const d = diff(stage);
  const info = stageInfo(stage);
  const isCheckpoint = index % PLANETS_PER_STAGE === 0;

  const r = isCheckpoint ? d.r * 1.35 : d.r * rand(0.85, 1.15);
  const ring = (isCheckpoint ? d.ring * 1.22 : d.ring * rand(0.92, 1.08));

  const p = {
    id: planetSeq++, index, stage, info, isCheckpoint,
    col: isCheckpoint ? varyPalette(info, 0, 0) : varyPalette(info, rand(-16, 16), rand(-7, 7)),
    x, y, baseX: x,
    r, ring,
    spin: rand(d.spin * 0.8, d.spin * 1.2) * (Math.random() < 0.5 ? -1 : 1),
    rot: rand(0, TAU),
    // 이동 행성
    move: (index > 0 && Math.random() < d.moveChance)
      ? { amp: rand(35, 70), sp: rand(0.5, 1.1), ph: rand(0, TAU) } : null,
    // 장애물 (궤도를 도는 소행성)
    obstacle: (index > 0 && Math.random() < d.obstacleChance)
      ? { a: rand(0, TAU), sp: rand(1.6, 3.0) * (Math.random() < 0.5 ? -1 : 1), d: ring + rand(28, 42), r: 13 } : null,
    decay: 0,
    timer: 0, landed: false, dying: false, alpha: 1,
  };
  // 붕괴 행성 — 소행성이 도는 행성에는 붙이지 않는다 (겹치면 지나치게 가혹)
  if (index > 0 && !isCheckpoint && !p.obstacle && Math.random() < d.decayChance) {
    p.decay = d.decayTime;
  }
  return p;
}

function spawnAhead() {
  while (state.planets.length < 2 || state.planets[state.planets.length - 1].y > state.camY - H * 1.2) {
    const prev = state.planets[state.planets.length - 1];
    const index = prev ? prev.index + 1 : 0;
    const d = diff(Math.floor(index / PLANETS_PER_STAGE) + 1);
    let x, y;
    if (!prev) { x = W / 2; y = H - 190; }
    else {
      const margin = 96;
      let dx = rand(50, d.spread) * (Math.random() < 0.5 ? -1 : 1);
      x = clamp(prev.x + dx, margin, W - margin);
      if (Math.abs(x - prev.x) < 42) x = prev.x + (x >= prev.x ? 42 : -42);
      x = clamp(x, margin, W - margin);
      y = prev.y - rand(d.gap * 0.8, d.gap * 1.1);
    }
    state.planets.push(createPlanet(index, x, y));
  }
  // 화면 아래로 한참 지나간 행성 제거 (현재 착지한 행성은 유지)
  while (state.planets.length > 24 &&
         (!state.player || state.planets[0].id !== state.player.planetId)) {
    state.planets.shift();
  }
}

// ───────────────────────────────────────── 파티클
function burst(x, y, n, color, speed = 140, life = 0.6, size = 3) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(speed * 0.3, speed);
    state.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life, max: life, color, size: rand(size * 0.5, size),
    });
  }
}

function addPop(x, y, text, color, size = 22, life = 1.1) {
  state.pops.push({ x, y, text, color, size, t: life, max: life, vy: 46 });
}
function addRing(x, y, r0, r1, color, life = 0.55, w = 3) {
  state.rings.push({ x, y, r0, r1, color, t: life, max: life, w });
}

// 화면 아래 끝까지 남은 거리 → 위험도 0~1
function dangerLevel() {
  if (!state.player) return 0;
  const sy = state.player.y - state.camY;
  return clamp(1 - (H - sy) / 300, 0, 1);
}

// ───────────────────────────────────────── 게임 리셋
function reset() {
  state.planets = [];
  planetSeq = 0;
  state.score = 0;
  state.stage = 1;
  state.particles = [];
  state.pops = [];
  state.rings = [];
  state.banner = null;
  state.shake = 0;
  state.flash = 0;
  state.deathMsg = '';
  state.scrolling = false;
  state.danger = 0;
  state.warnT = 0;
  state.combo = 0;
  state.comboT = 0;
  state.bestCombo = 0;
  state.scorePop = 0;
  state.pulse = null;
  state.landed = 0;
  state.player = null;
  // 카메라를 먼저 초기화해야 spawnAhead가 이전 판의 높이까지 행성을 쏟아내지 않는다
  state.camY = (H - 190) - H * CAM_ANCHOR;
  state.camTarget = state.camY;
  spawnAhead();
  const p0 = state.planets[0];
  state.player = {
    mode: 'orbit', planetId: p0.id, angle: -Math.PI / 2, dir: 1,
    x: 0, y: 0, vx: 0, vy: 0, ignore: -1, flyT: 0, trail: [],
  };
  p0.landed = true;
  state.camY = p0.y - H * CAM_ANCHOR;
  state.camTarget = state.camY;
  syncOrbitPos();
  spawnAhead();
}

function planetById(id) {
  for (let i = 0; i < state.planets.length; i++) if (state.planets[i].id === id) return state.planets[i];
  return null;
}

function syncOrbitPos() {
  const pl = state.player, p = planetById(pl.planetId);
  if (!p) return;
  pl.x = p.x + Math.cos(pl.angle) * p.ring;
  pl.y = p.y + Math.sin(pl.angle) * p.ring;
}

// ───────────────────────────────────────── 입력
function jump() {
  const pl = state.player;
  if (pl.mode !== 'orbit') return;
  const p = planetById(pl.planetId);
  if (!p) return;
  const d = diff(p.stage);
  // 행성 중심 → 우주선 위치를 잇는 직선(바깥) 방향으로 발사
  const tx = Math.cos(pl.angle);
  const ty = Math.sin(pl.angle);
  pl.vx = tx * d.speed;
  pl.vy = ty * d.speed;
  pl.mode = 'fly';
  pl.ignore = p.id;
  pl.flyT = 0;
  pl.trail.length = 0;
  p.landed = false;
  if (p.decay) p.dying = true;      // 떠나면 붕괴 확정
  burst(pl.x, pl.y, 10, p.col.ac, 120, 0.4, 2.5);
  sfx.jump();
}

function die(msg) {
  if (state.mode !== 'play') return;
  state.mode = 'over';
  state.overT = 0;
  state.deathMsg = msg;
  state.shake = 14;
  state.flash = 0.5;
  burst(state.player.x, state.player.y, 34, '#ff6b6b', 260, 0.9, 4);
  burst(state.player.x, state.player.y, 20, '#ffd166', 180, 0.7, 3);
  if (state.score > state.best) {
    state.best = state.score;
    localStorage.setItem('spacejump_best', String(state.best));
  }
  sfx.die();
}

function onPress(px, py) {
  sfx.init();
  // 사운드 토글 버튼 히트 테스트
  if (px > W - 52 && px < W - 10 && py > 8 && py < 50) { sfx.on = !sfx.on; return; }

  // 타이밍 게임이므로 시작 탭은 발사하지 않고 궤도 대기 상태로 진입
  if (state.mode === 'title') state.mode = 'play';
  else if (state.mode === 'play') jump();
  else if (state.mode === 'over' && state.overT > 0.5) { reset(); state.mode = 'play'; }
}

function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  const cy = (e.touches ? e.touches[0].clientY : e.clientY);
  return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H };
}

canvas.addEventListener('pointerdown', e => { e.preventDefault(); const p = pointerPos(e); onPress(p.x, p.y); });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') { e.preventDefault(); onPress(-1, -1); }
  if (e.code === 'KeyM') { sfx.init(); sfx.on = !sfx.on; }
});

// ───────────────────────────────────────── 업데이트
function update(dt) {
  const pl = state.player;

  // 행성 물리
  for (const p of state.planets) {
    p.rot += p.spin * dt;
    if (p.move) { p.x = p.baseX + Math.sin(performance.now() / 1000 * p.move.sp + p.move.ph) * p.move.amp; }
    if (p.obstacle) p.obstacle.a += p.obstacle.sp * dt;
    if (p.dying) { p.alpha -= dt * 1.6; }
  }

  if (state.mode === 'play') {
    if (pl.mode === 'orbit') {
      const p = planetById(pl.planetId);
      if (p) {
        // 공전 속도는 행성 자전 속도 크기, 방향은 진입 방향
        pl.angle += Math.abs(p.spin) * ORBIT_SPIN * dt * pl.dir;
        syncOrbitPos();
        // 붕괴 타이머
        if (p.decay) {
          p.timer -= dt;
          if (p.timer <= 0) { p.dying = true; die('행성 붕괴'); }
        }
        // 궤도 중 장애물 충돌
        if (p.obstacle) {
          const ox = p.x + Math.cos(p.obstacle.a) * p.obstacle.d;
          const oy = p.y + Math.sin(p.obstacle.a) * p.obstacle.d;
          if (Math.hypot(ox - pl.x, oy - pl.y) < p.obstacle.r + PLAYER_R) die('소행성 충돌');
        }
      }
    } else {
      // 비행
      pl.flyT += dt;
      pl.x += pl.vx * dt;
      pl.y += pl.vy * dt;
      pl.trail.push({ x: pl.x, y: pl.y });
      if (pl.trail.length > 18) pl.trail.shift();

      // 캡처 판정
      for (const p of state.planets) {
        if (p.dying || p.alpha <= 0) continue;
        const dx = pl.x - p.x, dy = pl.y - p.y;
        const dist = Math.hypot(dx, dy);
        if (p.id === pl.ignore) { if (dist > p.ring * 1.2) pl.ignore = -1; continue; }
        if (dist <= p.ring) { land(p, dx, dy, dist); break; }
      }

      // 장애물 충돌
      if (pl.mode === 'fly') {
        for (const p of state.planets) {
          if (!p.obstacle || p.dying) continue;
          const ox = p.x + Math.cos(p.obstacle.a) * p.obstacle.d;
          const oy = p.y + Math.sin(p.obstacle.a) * p.obstacle.d;
          if (Math.hypot(ox - pl.x, oy - pl.y) < p.obstacle.r + PLAYER_R) { die('소행성 충돌'); break; }
        }
      }

      // 실패 조건 (비행 중) — 화면 아래로 밀려나는 판정은 아래에서 일괄 처리
      if (pl.mode === 'fly') {
        if (pl.x < -40 || pl.x > W + 40) die('궤도 이탈');
        else if (pl.flyT > FLIGHT_TIMEOUT) die('우주 미아');
      }
    }

    // 목성 라운드부터 화면이 스스로 계속 위로 올라간다.
    // 점프해서 화면이 밀려 올라가는 것과 같은 움직임이, 멈춰 있어도 천천히 계속 일어난다.
    if (state.mode === 'play' && state.stage >= HAZARD_STAGE) {
      state.scrolling = true;
      state.camTarget -= diff(state.stage).scroll * dt;
    }
  }

  // 화면 아래로 밀려나면 끝
  if (state.mode === 'play') {
    state.danger = dangerLevel();
    const sy = pl.y - state.camY;
    if (sy > H - PLAYER_R * 0.4) {
      state.shake = 16;
      // 점프를 놓쳐 떨어진 건지, 올라오는 화면에 밀려난 건지 구분
      die(pl.mode === 'fly' && pl.vy > 60 ? '추락' : '화면 밖으로 밀려남');
    } else if (state.scrolling && state.danger > 0.55) {
      state.warnT -= dt;
      if (state.warnT <= 0) { state.warnT = lerp(0.5, 0.13, (state.danger - 0.55) / 0.45); sfx.warn(); }
    }
  }

  // 카메라 (위로만 이동) — 착지하면 그 행성을 화면 아래쪽에 고정해서
  // 직전 행성은 화면 밖으로 밀려나가게 한다
  let target = state.camTarget;
  if (pl.mode === 'fly') target = Math.min(target, pl.y - H * CAM_FLY);
  if (target < state.camY) state.camY += (target - state.camY) * Math.min(1, dt * 5);

  spawnAhead();

  // 파티클
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const q = state.particles[i];
    q.life -= dt;
    if (q.life <= 0) { state.particles.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= 0.94; q.vy *= 0.94;
  }

  // 점수/칭찬 텍스트
  for (let i = state.pops.length - 1; i >= 0; i--) {
    const q = state.pops[i];
    q.t -= dt;
    if (q.t <= 0) { state.pops.splice(i, 1); continue; }
    q.y -= q.vy * dt;
    q.vy *= Math.pow(0.25, dt);
  }
  // 착지 충격파
  for (let i = state.rings.length - 1; i >= 0; i--) {
    const q = state.rings[i];
    q.t -= dt;
    if (q.t <= 0) state.rings.splice(i, 1);
  }

  // 콤보 유지 시간
  if (state.comboT > 0) {
    state.comboT -= dt;
    if (state.comboT <= 0) state.combo = 0;
  }
  state.scorePop = Math.max(0, state.scorePop - dt * 2.6);
  if (state.pulse) { state.pulse.a -= dt * 1.8; if (state.pulse.a <= 0) state.pulse = null; }

  if (state.banner) { state.banner.t -= dt; if (state.banner.t <= 0) state.banner = null; }
  state.shake *= Math.pow(0.001, dt);
  state.flash = Math.max(0, state.flash - dt * 1.6);
  if (state.mode === 'over') state.overT += dt;
}

function land(p, dx, dy, dist) {
  const pl = state.player;
  pl.mode = 'orbit';
  pl.planetId = p.id;
  pl.angle = Math.atan2(dy, dx);
  // 진입 속도의 회전 방향으로 공전 방향 결정
  const cross = dx * pl.vy - dy * pl.vx;
  pl.dir = cross >= 0 ? 1 : -1;
  pl.trail.length = 0;
  p.landed = true;
  if (p.decay) p.timer = p.decay;
  syncOrbitPos();
  state.camTarget = Math.min(state.camTarget, p.y - H * CAM_ANCHOR);

  // ── 콤보 & 점수
  state.landed++;
  state.combo = state.comboT > 0 ? state.combo + 1 : 1;
  state.comboT = COMBO_WINDOW;
  if (state.combo > state.bestCombo) state.bestCombo = state.combo;

  const mult = Math.min(9, state.combo);
  const perfect = dist < p.ring * 0.58;          // 궤도 깊숙이 꽂아 넣은 정밀 착지
  let gain = 10 * mult + (perfect ? 15 : 0) + (p.isCheckpoint ? 30 : 0);
  state.score += gain;
  state.scorePop = 1;

  // ── 시각 연출
  state.shake = perfect ? 7 : 5;
  state.pulse = { a: perfect ? 0.6 : 0.34, max: perfect ? 0.6 : 0.34, color: perfect ? '#ffd166' : p.col.c1 };
  burst(pl.x, pl.y, perfect ? 22 : 14, p.col.ac, perfect ? 210 : 150, 0.5, 3);
  addRing(p.x, p.y, p.ring * 0.45, p.ring * 1.85, p.col.ac, 0.5, 3);
  if (perfect) {
    addRing(p.x, p.y, p.ring * 0.2, p.ring * 2.5, '#ffd166', 0.7, 2);
    burst(pl.x, pl.y, 12, '#fff1b8', 260, 0.7, 2.5);
  }

  addPop(pl.x, pl.y - 16, `+${gain}`, perfect ? '#ffd166' : '#ffffff', perfect ? 27 : 22);
  if (perfect) addPop(pl.x, pl.y - 44, 'PERFECT!', '#ffe28a', 17, 0.95);
  if (state.combo >= 2) addPop(p.x, p.y - p.ring - 26, `COMBO x${state.combo}`, p.col.c1, 15, 1.0);

  const PRAISE = [
    [12, 'UNSTOPPABLE!', '#ff9ec4'],
    [8,  'AMAZING!',     '#c9a4ff'],
    [5,  'GREAT!',       '#8fe3ff'],
    [3,  'NICE!',        '#7dffb0'],
  ];
  for (const [need, word, color] of PRAISE) {
    if (state.combo === need) { addPop(p.x, p.y - p.ring - 52, word, color, 21, 1.2); sfx.praise(); break; }
  }

  sfx.land(state.combo, perfect);

  // 스테이지 진입
  if (p.stage !== state.stage) {
    state.stage = p.stage;
    state.banner = {
      text: `${p.info.name} 궤도 진입`,
      sub: `STAGE ${p.stage} · ${p.info.sub}`,
      warn: p.stage === HAZARD_STAGE ? '⚠ 화면이 계속 올라온다 — 밀려나면 끝' : null,
      t: p.stage === HAZARD_STAGE ? 2.8 : 2.0,
    };
    burst(p.x, p.y, 26, p.col.c1, 200, 0.9, 3.5);
    addRing(p.x, p.y, p.ring * 0.3, p.ring * 3.4, p.col.c1, 1.0, 2.5);
    sfx.stage();
  }
}

// ───────────────────────────────────────── 렌더
function drawStars() {
  const t = performance.now() / 1000;
  for (const s of state.stars) {
    // 시차 스크롤 + 세로 랩핑
    let y = (s.y - state.camY * s.z) % (H * 2);
    if (y < 0) y += H * 2;
    y -= (H * 0.5);
    if (y < -20 || y > H + 20) continue;
    const tw = 0.55 + 0.45 * Math.sin(t * 2 + s.tw);
    ctx.globalAlpha = s.z * tw;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(s.x, y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
}

function drawPlanet(p) {
  const y = p.y - state.camY;
  if (y < -220 || y > H + 220) return;
  const info = p.info, col = p.col;
  ctx.save();
  ctx.globalAlpha = clamp(p.alpha, 0, 1);

  // 궤도 링
  const decayRatio = p.decay && p.landed ? clamp(p.timer / p.decay, 0, 1) : 1;
  ctx.save();
  ctx.translate(p.x, y);
  ctx.rotate(p.rot * 0.5);
  ctx.setLineDash([6, 8]);
  ctx.lineWidth = p.isCheckpoint ? 2 : 1.2;
  ctx.strokeStyle = p.decay && p.landed
    ? `rgba(255,${Math.round(90 + 120 * decayRatio)},90,${0.5 + 0.4 * (1 - decayRatio)})`
    : `rgba(255,255,255,${p.isCheckpoint ? 0.35 : 0.2})`;
  ctx.beginPath(); ctx.arc(0, 0, p.ring, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // 대기광
  const glow = ctx.createRadialGradient(p.x, y, p.r * 0.6, p.x, y, p.r * 2.1);
  glow.addColorStop(0, hexA(col.c1, 0.28));
  glow.addColorStop(1, hexA(col.c1, 0));
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(p.x, y, p.r * 2.1, 0, TAU); ctx.fill();

  // 토성형 고리 (뒤쪽)
  if (info.type === 'ringed') {
    ctx.save(); ctx.translate(p.x, y); ctx.rotate(-0.35);
    ctx.strokeStyle = hexA(col.ac, 0.55); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(0, 0, p.r * 1.9, p.r * 0.55, 0, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  // 본체
  const g = ctx.createRadialGradient(p.x - p.r * 0.35, y - p.r * 0.4, p.r * 0.1, p.x, y, p.r);
  g.addColorStop(0, col.c1);
  g.addColorStop(1, col.c2);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, y, p.r, 0, TAU); ctx.fill();

  // 표면 디테일
  ctx.save();
  ctx.beginPath(); ctx.arc(p.x, y, p.r, 0, TAU); ctx.clip();
  ctx.translate(p.x, y); ctx.rotate(p.rot);
  if (info.type === 'gas' || info.type === 'ringed') {
    ctx.globalAlpha = 0.25 * clamp(p.alpha, 0, 1);
    ctx.fillStyle = col.ac;
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath();
      ctx.ellipse(0, i * p.r * 0.32, p.r * 1.2, p.r * 0.1, 0, 0, TAU);
      ctx.fill();
    }
  } else if (info.type === 'terra') {
    ctx.globalAlpha = 0.75 * clamp(p.alpha, 0, 1);
    ctx.fillStyle = col.ac;
    ctx.beginPath(); ctx.ellipse(-p.r * 0.3, -p.r * 0.2, p.r * 0.45, p.r * 0.3, 0.4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(p.r * 0.35, p.r * 0.3, p.r * 0.35, p.r * 0.22, -0.3, 0, TAU); ctx.fill();
  } else {
    ctx.globalAlpha = 0.2 * clamp(p.alpha, 0, 1);
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-p.r * 0.3, -p.r * 0.25, p.r * 0.22, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(p.r * 0.35, p.r * 0.1, p.r * 0.16, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(0, p.r * 0.45, p.r * 0.12, 0, TAU); ctx.fill();
  }
  ctx.restore();

  // 자전 방향 표시(작은 화살표)
  ctx.globalAlpha = 0.5 * clamp(p.alpha, 0, 1);
  ctx.fillStyle = '#fff';
  const aa = p.rot;
  ctx.beginPath();
  ctx.arc(p.x + Math.cos(aa) * (p.r + 7), y + Math.sin(aa) * (p.r + 7), 1.8, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = clamp(p.alpha, 0, 1);

  // 체크포인트 라벨
  if (p.isCheckpoint) {
    ctx.globalAlpha = 0.8 * clamp(p.alpha, 0, 1);
    ctx.fillStyle = col.c1;
    ctx.font = 'bold 12px -apple-system, "Noto Sans KR", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(info.name, p.x, y + p.ring + 20);
    ctx.globalAlpha = 0.35;
    ctx.font = '9px monospace';
    ctx.fillText(`STAGE ${p.stage}`, p.x, y + p.ring + 33);
  }

  // 장애물
  if (p.obstacle) {
    const ox = p.x + Math.cos(p.obstacle.a) * p.obstacle.d;
    const oy = y + Math.sin(p.obstacle.a) * p.obstacle.d;
    ctx.globalAlpha = clamp(p.alpha, 0, 1);
    const og = ctx.createRadialGradient(ox, oy, 1, ox, oy, p.obstacle.r * 2.2);
    og.addColorStop(0, 'rgba(255,110,110,.5)');
    og.addColorStop(1, 'rgba(255,110,110,0)');
    ctx.fillStyle = og;
    ctx.beginPath(); ctx.arc(ox, oy, p.obstacle.r * 2.2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff7a6b';
    ctx.beginPath();
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * TAU + p.obstacle.a * 2;
      const rr = p.obstacle.r * (i % 2 ? 0.72 : 1);
      const fx = ox + Math.cos(a) * rr, fy = oy + Math.sin(a) * rr;
      i ? ctx.lineTo(fx, fy) : ctx.moveTo(fx, fy);
    }
    ctx.closePath(); ctx.fill();
  }

  ctx.restore();
}

// 올라오는 화면의 아래 경계 — 여기에 닿으면 밀려나 끝난다
function drawScrollEdge() {
  if (!state.scrolling) return;
  const t = performance.now() / 1000;
  const k = clamp(state.danger, 0, 1);

  ctx.save();
  // 아래에서 차오르는 어두운 기운 (가까울수록 짙어진다)
  const h = 150 + 90 * k;
  const g = ctx.createLinearGradient(0, H - h, 0, H);
  g.addColorStop(0, 'rgba(255,45,105,0)');
  g.addColorStop(1, `rgba(255,45,105,${0.10 + 0.34 * k})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, H - h, W, h);

  // 경계선 — 화면이 밀어 올리는 선
  ctx.globalAlpha = 0.35 + 0.45 * k;
  ctx.strokeStyle = '#ff5c8a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, H - 2);
  ctx.lineTo(W, H - 2);
  ctx.stroke();

  // 경계에서 위로 흘러가는 짧은 선들 — 화면이 올라오는 방향을 보여준다
  ctx.globalAlpha = 0.3 + 0.4 * k;
  ctx.strokeStyle = '#ff9ec4';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 7; i++) {
    const x = ((i * 97 + Math.sin(i * 2.3) * 30) % W + W) % W;
    const prog = ((t * (0.55 + i * 0.07) + i * 0.37) % 1);
    const y = H - prog * (110 + 60 * k);
    ctx.globalAlpha = (0.3 + 0.45 * k) * (1 - prog);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y + 12);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // 임박 경고 — 붉은 비네트가 맥동
  if (k > 0.45) {
    const p = (k - 0.45) / 0.55;
    ctx.save();
    const a = 0.3 * p * (0.55 + 0.45 * Math.sin(t * 14));
    const v = ctx.createRadialGradient(W / 2, H * 0.62, H * 0.3, W / 2, H * 0.62, H * 0.72);
    v.addColorStop(0, 'rgba(255,47,109,0)');
    v.addColorStop(0.6, `rgba(255,47,109,${a * 0.3})`);
    v.addColorStop(1, `rgba(255,47,109,${a})`);
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

function hexA(hex, a) {
  if (hex.startsWith('hsl')) return hex.replace('hsl(', 'hsla(').replace(')', `,${a})`);
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

function drawAimGuide() {
  const pl = state.player;
  if (pl.mode !== 'orbit') return;
  const p = planetById(pl.planetId);
  if (!p) return;
  // 발사 방향 표시선은 튜토리얼 구간인 지구(스테이지 1)에서만
  if (p.stage > 1) return;
  const tx = Math.cos(pl.angle), ty = Math.sin(pl.angle);
  const y = pl.y - state.camY;
  ctx.save();
  const N = 16;
  for (let i = 1; i <= N; i++) {
    const d = i * 25;
    ctx.globalAlpha = 0.6 * (1 - i / (N + 2));
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(pl.x + tx * d, y + ty * d, 3.2 * (1 - i / (N + 6)), 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawPlayer() {
  const pl = state.player;
  const y = pl.y - state.camY;
  const t = performance.now() / 1000;

  // 꼬리 — 안쪽 흰 코어 + 바깥 청보라 잔광
  if (pl.trail.length > 1) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.globalCompositeOperation = 'lighter';
    for (const [wMul, color, aMul] of [[1, '#4a6cff', 0.32], [0.45, '#bff0ff', 0.6]]) {
      for (let i = 1; i < pl.trail.length; i++) {
        const a = i / pl.trail.length;
        ctx.globalAlpha = a * aMul;
        ctx.strokeStyle = color;
        ctx.lineWidth = a * 11 * wMul;
        ctx.beginPath();
        ctx.moveTo(pl.trail[i - 1].x, pl.trail[i - 1].y - state.camY);
        ctx.lineTo(pl.trail[i].x, pl.trail[i].y - state.camY);
        ctx.stroke();
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  if (state.mode === 'over') return;

  // 진행 방향
  let ang;
  if (pl.mode === 'fly') ang = Math.atan2(pl.vy, pl.vx);
  else ang = pl.angle;   // 궤도 중에는 발사될 바깥 방향을 향해 기수를 든다

  const flying = pl.mode === 'fly';

  ctx.save();
  ctx.translate(pl.x, y);

  // 기체 글로우
  const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 40);
  g.addColorStop(0, 'rgba(120,200,255,.5)');
  g.addColorStop(0.45, 'rgba(90,130,255,.22)');
  g.addColorStop(1, 'rgba(90,130,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 40, 0, TAU); ctx.fill();

  ctx.rotate(ang);

  // ── 엔진 화염 (기체 뒤)
  const fl = flying ? 30 + Math.sin(t * 70) * 6 + Math.random() * 9
                    : 10 + Math.sin(t * 22) * 2 + Math.random() * 3;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const fg = ctx.createLinearGradient(-12, 0, -13 - fl, 0);
  fg.addColorStop(0, 'rgba(210,245,255,.95)');
  fg.addColorStop(0.3, 'rgba(90,170,255,.7)');
  fg.addColorStop(0.7, 'rgba(120,70,255,.35)');
  fg.addColorStop(1, 'rgba(120,70,255,0)');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(-11, 5.2);
  ctx.quadraticCurveTo(-13 - fl * 0.5, 2.6, -13 - fl, 0);
  ctx.quadraticCurveTo(-13 - fl * 0.5, -2.6, -11, -5.2);
  ctx.closePath(); ctx.fill();
  // 흰 코어
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath();
  ctx.moveTo(-11, 2.4);
  ctx.quadraticCurveTo(-13 - fl * 0.22, 1.1, -12 - fl * 0.42, 0);
  ctx.quadraticCurveTo(-13 - fl * 0.22, -1.1, -11, -2.4);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // ── 후퇴익 (본체 뒤에 깔린다)
  const wg = ctx.createLinearGradient(0, 0, -14, 16);
  wg.addColorStop(0, '#5f7cc4');
  wg.addColorStop(1, '#1b2547');
  for (const s of [1, -1]) {
    ctx.save();
    ctx.scale(1, s);
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.moveTo(3, 2.6);
    ctx.lineTo(-8.5, 15.5);
    ctx.lineTo(-13.5, 15.0);
    ctx.lineTo(-9, 3.2);
    ctx.closePath(); ctx.fill();
    // 앞날 발광 에지
    ctx.strokeStyle = 'rgba(90,230,255,.85)';
    ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(3, 2.6); ctx.lineTo(-8.5, 15.5); ctx.stroke();
    ctx.restore();
  }

  // ── 날개 끝 항법등
  const blink = 0.45 + 0.55 * Math.abs(Math.sin(t * 4.5));
  for (const [ly, lc] of [[15.4, '#ff4d78'], [-15.4, '#4dffc3']]) {
    ctx.globalAlpha = blink;
    const lg = ctx.createRadialGradient(-11, ly, 0.4, -11, ly, 6);
    lg.addColorStop(0, lc);
    lg.addColorStop(1, hexA(lc, 0));
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.arc(-11, ly, 6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-11, ly, 1.3, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ── 본체 (다트형 헐)
  const hull = () => {
    ctx.beginPath();
    ctx.moveTo(20, 0);
    ctx.bezierCurveTo(13, 3.0, 5, 5.0, -5, 6.1);
    ctx.lineTo(-11.5, 5.0);
    ctx.lineTo(-11.5, -5.0);
    ctx.lineTo(-5, -6.1);
    ctx.bezierCurveTo(5, -5.0, 13, -3.0, 20, 0);
    ctx.closePath();
  };
  const hg = ctx.createLinearGradient(0, -7, 0, 7);
  hg.addColorStop(0, '#ffffff');
  hg.addColorStop(0.34, '#d5e2fb');
  hg.addColorStop(0.62, '#8496bf');
  hg.addColorStop(1, '#38446a');
  ctx.fillStyle = hg;
  hull(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 0.9;
  hull(); ctx.stroke();

  // 헐 위 액센트 스트라이프
  ctx.save();
  hull(); ctx.clip();
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.fillRect(-12, 1.4, 34, 6);
  ctx.fillStyle = 'rgba(60,220,255,.9)';
  ctx.fillRect(-9, -0.7, 22, 1.4);
  ctx.fillStyle = 'rgba(255,120,60,.75)';
  ctx.fillRect(-9, 2.8, 9, 1.1);
  ctx.restore();

  // ── 조종석 캐노피
  const cg = ctx.createLinearGradient(2, -3.4, 11, 3.4);
  cg.addColorStop(0, '#07142e');
  cg.addColorStop(0.45, '#2aa7ff');
  cg.addColorStop(1, '#d8fbff');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.ellipse(6.4, 0, 6.2, 3.5, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.ellipse(6.4, 0, 6.2, 3.5, 0, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(8.2, -1.1, 2.1, 0.9, -0.25, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;

  // ── 엔진 노즐
  ctx.fillStyle = '#20263f';
  ctx.fillRect(-13.2, -4.6, 3.2, 3.2);
  ctx.fillRect(-13.2, 1.4, 3.2, 3.2);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = `rgba(120,225,255,${flying ? 0.95 : 0.6})`;
  ctx.fillRect(-13.0, -4.0, 2.2, 2.0);
  ctx.fillRect(-13.0, 2.0, 2.2, 2.0);
  ctx.restore();

  ctx.restore();
}

function drawParticles() {
  for (const q of state.particles) {
    const a = q.life / q.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = q.color;
    ctx.beginPath();
    ctx.arc(q.x, q.y - state.camY, q.size * a, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawRings() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const q of state.rings) {
    const k = 1 - q.t / q.max;           // 0 → 1 로 퍼진다
    const e = 1 - Math.pow(1 - k, 3);    // 처음엔 빠르게, 끝엔 천천히
    ctx.globalAlpha = (1 - k) * 0.85;
    ctx.strokeStyle = q.color;
    ctx.lineWidth = q.w * (1 - k * 0.7);
    ctx.beginPath();
    ctx.arc(q.x, q.y - state.camY, lerp(q.r0, q.r1, e), 0, TAU);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawPops() {
  ctx.save();
  ctx.textAlign = 'center';
  for (const q of state.pops) {
    const k = q.t / q.max;
    const pop = k > 0.82 ? 1 + (k - 0.82) * 3.2 : 1;   // 나타날 때 살짝 튄다
    ctx.globalAlpha = Math.min(1, k * 2.6);
    ctx.save();
    ctx.translate(q.x, q.y - state.camY);
    ctx.scale(pop, pop);
    ctx.font = `bold ${q.size}px -apple-system, "Noto Sans KR", sans-serif`;
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = 'rgba(0,0,0,.55)';
    ctx.strokeText(q.text, 0, 0);
    ctx.fillStyle = q.color;
    ctx.fillText(q.text, 0, 0);
    ctx.restore();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

// 착지 순간 화면 가장자리에서 번지는 색 펄스
function drawPulse() {
  if (!state.pulse) return;
  const k = clamp(state.pulse.a / state.pulse.max, 0, 1);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(W / 2, H * 0.6, H * 0.18, W / 2, H * 0.6, H * 0.72);
  g.addColorStop(0, hexA(state.pulse.color, 0));
  g.addColorStop(1, hexA(state.pulse.color, 0.42 * k));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function drawHUD() {
  const info = stageInfo(state.stage);

  // 점수 (착지할 때마다 튄다)
  const sp = 1 + state.scorePop * 0.28;
  ctx.save();
  ctx.textAlign = 'left';
  ctx.translate(18, 52);
  ctx.scale(sp, sp);
  ctx.fillStyle = state.scorePop > 0.4 ? '#ffe9a8' : '#ffffff';
  ctx.font = 'bold 42px -apple-system, "Noto Sans KR", sans-serif';
  ctx.globalAlpha = state.mode === 'title' ? 0.15 : 0.92;
  ctx.fillText(String(state.score), 0, 0);
  ctx.restore();
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffffff';
  ctx.font = '11px monospace';
  ctx.globalAlpha = 0.45;
  ctx.fillText(`BEST ${state.best}`, 20, 70);
  ctx.globalAlpha = 1;

  // 콤보 게이지
  if (state.mode === 'play' && state.combo >= 2) {
    const k = clamp(state.comboT / COMBO_WINDOW, 0, 1);
    const hue = clamp(180 + state.combo * 14, 0, 320);
    ctx.save();
    ctx.textAlign = 'left';
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = `hsl(${hue},100%,72%)`;
    ctx.font = 'bold 20px -apple-system, "Noto Sans KR", sans-serif';
    ctx.fillText(`x${state.combo}`, 20, 96);
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#fff';
    ctx.fillRect(20, 104, 84, 4);
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = `hsl(${hue},100%,68%)`;
    ctx.fillRect(20, 104, 84 * k, 4);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // 화면 상승 압박 미터 — 아래 경계까지 남은 여유
  if (state.scrolling) {
    const k = clamp(state.danger, 0, 1);
    ctx.save();
    ctx.textAlign = 'right';
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#fff';
    ctx.font = '9px monospace';
    ctx.fillText('SCREEN RISING', W - 60, 62);
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = '#fff';
    ctx.fillRect(W - 130, 68, 70, 4);
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = k > 0.6 ? '#ff2f6d' : '#ff9ec4';
    ctx.fillRect(W - 130, 68, 70 * k, 4);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // 스테이지 표시
  ctx.textAlign = 'right';
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = info.c1;
  ctx.font = 'bold 14px -apple-system, "Noto Sans KR", sans-serif';
  ctx.fillText(info.name, W - 60, 30);
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = '#fff';
  ctx.font = '10px monospace';
  ctx.fillText(`STAGE ${state.stage}`, W - 60, 45);
  ctx.globalAlpha = 1;

  // 사운드 아이콘
  ctx.save();
  ctx.translate(W - 32, 26);
  ctx.globalAlpha = sfx.on ? 0.75 : 0.3;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(-6, -3); ctx.lineTo(-2, -3); ctx.lineTo(2, -7); ctx.lineTo(2, 7); ctx.lineTo(-2, 3); ctx.lineTo(-6, 3);
  ctx.closePath(); ctx.fill();
  if (sfx.on) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(3, 0, 5, -0.9, 0.9); ctx.stroke();
  } else {
    ctx.strokeStyle = '#ff8080'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(4, -5); ctx.lineTo(10, 5); ctx.moveTo(10, -5); ctx.lineTo(4, 5); ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // 붕괴 타이머 바
  const pl = state.player;
  if (state.mode === 'play' && pl.mode === 'orbit') {
    const p = planetById(pl.planetId);
    if (p && p.decay && p.timer > 0) {
      const ratio = clamp(p.timer / p.decay, 0, 1);
      const bw = 160;
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = 'rgba(255,255,255,.15)';
      ctx.fillRect(W / 2 - bw / 2, 24, bw, 5);
      ctx.fillStyle = ratio > 0.35 ? '#ffd166' : '#ff6b6b';
      ctx.fillRect(W / 2 - bw / 2, 24, bw * ratio, 5);
      ctx.globalAlpha = 0.6;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.font = '10px -apple-system, "Noto Sans KR", sans-serif';
      ctx.fillText('불안정한 행성 — 빨리 점프!', W / 2, 44);
      ctx.globalAlpha = 1;
    }
  }
}

function drawBanner() {
  if (!state.banner) return;
  const b = state.banner;
  const full = b.warn ? 2.8 : 2.0;
  const t = clamp(b.t / full, 0, 1);
  const a = t > 0.8 ? (1 - t) / 0.2 : Math.min(1, t / 0.3);
  const h = b.warn ? 104 : 78;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.fillRect(0, H * 0.34, W, h);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 26px -apple-system, "Noto Sans KR", sans-serif';
  ctx.fillText(b.text, W / 2, H * 0.34 + 36);
  ctx.globalAlpha = a * 0.6;
  ctx.font = '12px monospace';
  ctx.fillText(b.sub, W / 2, H * 0.34 + 58);
  if (b.warn) {
    ctx.globalAlpha = a * (0.65 + 0.35 * Math.sin(performance.now() / 1000 * 9));
    ctx.fillStyle = '#ff6b9d';
    ctx.font = 'bold 14px -apple-system, "Noto Sans KR", sans-serif';
    ctx.fillText(b.warn, W / 2, H * 0.34 + 86);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawTitle() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(5,6,15,.55)';
  ctx.fillRect(0, 0, W, H);

  const t = performance.now() / 1000;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 52px -apple-system, "Noto Sans KR", sans-serif';
  ctx.fillText('SPACE', W / 2, H * 0.3);
  ctx.fillStyle = '#5fd0ff';
  ctx.fillText('JUMP', W / 2, H * 0.3 + 56);

  ctx.globalAlpha = 0.6;
  ctx.fillStyle = '#fff';
  ctx.font = '13px -apple-system, "Noto Sans KR", sans-serif';
  ctx.fillText('지구에서 출발해 우주 끝까지', W / 2, H * 0.3 + 96);

  ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 3);
  ctx.font = 'bold 16px -apple-system, "Noto Sans KR", sans-serif';
  ctx.fillText('탭 / 스페이스로 점프', W / 2, H * 0.62);

  ctx.globalAlpha = 0.35;
  ctx.font = '11px -apple-system, "Noto Sans KR", sans-serif';
  ctx.fillText('우주선이 향한 직선 방향 그대로 발사됩니다', W / 2, H * 0.62 + 26);
  ctx.fillText('다음 행성의 점선 궤도 안에 들어가면 착지', W / 2, H * 0.62 + 44);
  ctx.fillText('빗나가면 그대로 우주 밖으로 — 타이밍이 전부', W / 2, H * 0.62 + 62);
  ctx.fillStyle = '#ff8fb5';
  ctx.fillText('목성부터 화면이 저절로 천천히 계속 올라온다', W / 2, H * 0.62 + 84);
  ctx.fillText('화면 아래로 밀려나면 끝 — 계속 위로 나아가라', W / 2, H * 0.62 + 102);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawOver() {
  const a = clamp(state.overT / 0.4, 0, 1);
  ctx.save();
  ctx.globalAlpha = a * 0.72;
  ctx.fillStyle = '#05060f';
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';

  ctx.fillStyle = '#ff6b6b';
  ctx.font = 'bold 15px -apple-system, "Noto Sans KR", sans-serif';
  ctx.fillText(state.deathMsg, W / 2, H * 0.32);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 78px -apple-system, "Noto Sans KR", sans-serif';
  ctx.fillText(String(state.score), W / 2, H * 0.44);

  ctx.globalAlpha = a * 0.6;
  ctx.font = '13px -apple-system, "Noto Sans KR", sans-serif';
  const info = stageInfo(state.stage);
  ctx.fillText(`도달: ${info.name} · STAGE ${state.stage}`, W / 2, H * 0.44 + 30);
  ctx.fillText(`행성 ${state.landed}개 · 최고 콤보 x${state.bestCombo}`, W / 2, H * 0.44 + 52);
  ctx.fillText(`최고 기록 ${state.best}`, W / 2, H * 0.44 + 74);

  if (state.overT > 0.5) {
    ctx.globalAlpha = a * (0.5 + 0.5 * Math.sin(performance.now() / 1000 * 3));
    ctx.font = 'bold 16px -apple-system, "Noto Sans KR", sans-serif';
    ctx.fillText('탭해서 다시 도전', W / 2, H * 0.62);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function draw(dt) {
  // 배경
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  const info = stageInfo(state.stage);
  bg.addColorStop(0, '#04050d');
  bg.addColorStop(0.55, '#05060f');
  bg.addColorStop(1, hexA(info.c2, 0.16));
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (state.shake > 0.2) {
    ctx.translate(rand(-state.shake, state.shake), rand(-state.shake, state.shake));
  }

  drawStars();
  for (const p of state.planets) drawPlanet(p);
  drawAimGuide();
  drawRings();
  drawPlayer();
  drawParticles();
  drawPops();
  ctx.restore();

  drawPulse();
  drawScrollEdge();   // 올라오는 화면 경계는 스크린 좌표계 — 흔들림 밖에서 그린다

  if (state.flash > 0) {
    ctx.globalAlpha = state.flash;
    ctx.fillStyle = '#ff5252';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  drawHUD();
  drawBanner();
  if (state.mode === 'title') drawTitle();
  if (state.mode === 'over') drawOver();
}

// ───────────────────────────────────────── 루프
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw(dt);
  requestAnimationFrame(loop);
}

reset();
requestAnimationFrame(loop);

// 밸런스 조정/테스트용 핸들
window.__spacejump = { state, jump, reset, diff, planetById, update, draw };
})();
</script>
