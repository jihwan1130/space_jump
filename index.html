<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05060f" />
<title>SPACE JUMP</title>
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <!-- 게임 화면 -->
  <canvas id="game"></canvas>

  <!-- 게임 위에 얹히는 UI. 게임 중에는 포인터 이벤트를 통과시켜요. -->
  <div id="ui" class="ui">

    <!-- 사운드 토글: 프레임워크 X 버튼(우측 상단)과 겹치지 않게 좌측 하단에 둬요 -->
    <button id="btn-sound" class="icon-btn" type="button" aria-label="소리 끄기">
      <span id="ico-sound" aria-hidden="true">🔊</span>
    </button>

    <!-- 타이틀 -->
    <section id="screen-title" class="screen">
      <div class="panel">
        <h1 class="logo">SPACE<span>JUMP</span></h1>
        <p class="tagline">지구에서 출발해 우주 끝까지</p>

        <div class="record">
          <div><span class="record-label">최고 기록</span><b id="title-best">0</b></div>
          <div><span class="record-label">최고 콤보</span><b id="title-best-combo">0</b></div>
        </div>

        <ul class="howto">
          <li>화면을 <b>탭</b>하면 우주선이 향한 방향 그대로 발사돼요.</li>
          <li>다음 행성의 <b>점선 궤도</b> 안에 들어가면 착지해요.</li>
          <li>목성(스테이지 4)부터 <b>화면이 저절로 올라와요.</b> 아래로 밀려나면 끝이에요.</li>
        </ul>

        <button id="btn-start" class="btn btn-primary" type="button">게임 시작하기</button>
        <button id="btn-rank-title" class="btn btn-ghost is-hidden" type="button">랭킹 보러 가기</button>
      </div>
    </section>

    <!-- 게임 오버 -->
    <section id="screen-over" class="screen is-hidden">
      <div class="panel">
        <p id="over-reason" class="over-reason">추락</p>
        <div class="over-score"><b id="over-score">0</b><span>점</span></div>
        <p id="over-detail" class="over-detail">도달: 지구 · STAGE 1</p>
        <p id="over-best" class="over-best">최고 기록 0</p>

        <button id="btn-revive" class="btn btn-reward is-hidden" type="button">
          광고 보고 이어하기 <em id="revive-count">(1회 남음)</em>
        </button>
        <button id="btn-retry" class="btn btn-primary" type="button">다시 도전하기</button>
        <button id="btn-rank-over" class="btn btn-ghost is-hidden" type="button">랭킹 보러 가기</button>
        <button id="btn-quit" class="btn btn-quiet" type="button">그만하기</button>
      </div>
    </section>

    <!-- 백그라운드에서 돌아왔을 때 -->
    <section id="screen-pause" class="screen is-hidden">
      <div class="panel panel-sm">
        <h2 class="panel-title">잠시 멈췄어요</h2>
        <p class="panel-desc">준비되면 이어서 진행할게요.</p>
        <button id="btn-resume" class="btn btn-primary" type="button">이어서 하기</button>
      </div>
    </section>

    <!-- 종료 확인 -->
    <section id="screen-exit" class="screen is-hidden">
      <div class="panel panel-sm">
        <h2 class="panel-title">게임을 종료할까요?</h2>
        <p class="panel-desc">진행 중인 판은 저장되지 않아요.</p>
        <button id="btn-exit-cancel" class="btn btn-primary" type="button">계속하기</button>
        <button id="btn-exit-confirm" class="btn btn-quiet" type="button">종료하기</button>
      </div>
    </section>

    <!-- 광고 로딩 등 짧은 대기 -->
    <div id="toast" class="toast is-hidden"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
