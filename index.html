<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05060f" />
<title>SPACE JUMP</title>
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <!-- 게임 화면 -->
  <canvas id="game"></canvas>

  <!-- 게임 위에 얹히는 UI. 게임 중에는 포인터 이벤트를 통과시켜요. -->
  <div id="ui" class="ui">

    <!--
      홈 — 별도의 시작 화면 패널 없이, 게임 화면 위에 그대로 얹혀요.
      아무 데나 탭하면 바로 시작하고, 우측 버튼을 누르면 그쪽으로 가요.
      버튼은 사각형 안에 아이콘을 넣은 게 아니라 **테두리 자체가 그 모양**이에요.
    -->
    <div id="home" class="home">
      <div class="home-top">
        <b id="home-nick">우주미아0000</b>
        <span id="home-wallet" class="wallet">0</span>
      </div>

      <div class="home-center">
        <h1 class="logo">SPACE<span>JUMP</span></h1>
        <p class="home-record">
          최고 <b id="home-best">0</b><i></i>콤보 <b id="home-combo">x0</b>
        </p>
        <p class="tap-hint"><span>화면을 탭하여 시작</span></p>
      </div>

      <div class="home-tools">
        <button id="btn-settings" class="shape-btn" type="button" aria-label="설정">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9.71 1.24 L14.29 1.24 L14.29 4.02 L16.02 4.74 L17.99 2.77 L21.23 6.01 L19.26 7.98 L19.98 9.71 L22.76 9.71 L22.76 14.29 L19.98 14.29 L19.26 16.02 L21.23 17.99 L17.99 21.23 L16.02 19.26 L14.29 19.98 L14.29 22.76 L9.71 22.76 L9.71 19.98 L7.98 19.26 L6.01 21.23 L2.77 17.99 L4.74 16.02 L4.02 14.29 L1.24 14.29 L1.24 9.71 L4.02 9.71 L4.74 7.98 L2.77 6.01 L6.01 2.77 L7.98 4.74 L9.71 4.02 Z" />
            <circle cx="12" cy="12" r="3.6" />
          </svg>
          <span class="shape-label">설정</span>
        </button>

        <button id="btn-shop" class="shape-btn" type="button" aria-label="상점">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <!-- 옆면을 곧게 세워요. 아래로 좁아지면 쓰레기통처럼 보여요. -->
            <path d="M5.4 8.6h13.2v10.9a2 2 0 0 1-2 2H7.4a2 2 0 0 1-2-2z" />
            <path d="M9 8.6V6.9a3 3 0 0 1 6 0v1.7" />
          </svg>
          <span class="shape-label">상점</span>
        </button>

        <button id="btn-rank" class="shape-btn" type="button" aria-label="랭킹">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M7.6 2.9h8.8v6.2a4.4 4.4 0 0 1-8.8 0z" />
            <path d="M7.6 4.4H4.9a3 3 0 0 0 2.9 3.6" />
            <path d="M16.4 4.4h2.7a3 3 0 0 1-2.9 3.6" />
            <path d="M12 13.5v3.2" />
            <path d="M8.9 20.6h6.2l-1-3.9H9.9z" />
          </svg>
          <span class="shape-label">랭킹</span>
        </button>
      </div>
    </div>

    <!-- 게임 중 일시정지. 프레임워크 X 버튼 바로 아래에 둬요. -->
    <button id="btn-pause" class="shape-btn shape-btn-pause is-hidden" type="button" aria-label="일시정지">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="6.2" y="4.4" width="4.4" height="15.2" rx="1.8" />
        <rect x="13.4" y="4.4" width="4.4" height="15.2" rx="1.8" />
      </svg>
    </button>

    <!-- 게임 오버 -->
    <section id="screen-over" class="screen is-hidden">
      <div class="panel">
        <p id="over-reason" class="over-reason">추락</p>
        <div class="over-score"><b id="over-score">0</b><span>점</span></div>
        <p id="over-detail" class="over-detail">도달: 지구 · STAGE 1</p>
        <p id="over-gems" class="over-gems is-hidden">보석 <b>0</b>개 획득</p>
        <p id="over-best" class="over-best">최고 기록 0</p>

        <button id="btn-revive" class="btn btn-reward is-hidden" type="button">광고보고 부활하기</button>
        <button id="btn-retry" class="btn btn-primary" type="button">재도전하기</button>
        <button id="btn-home-over" class="btn btn-ghost" type="button">홈으로 이동</button>
      </div>
    </section>

    <!-- 일시정지 (직접 누르거나, 백그라운드에서 돌아왔을 때) -->
    <section id="screen-pause" class="screen is-hidden">
      <div class="panel panel-sm">
        <h2 class="panel-title">잠시 멈췄어요</h2>
        <p class="panel-desc">준비되면 이어서 진행할게요.</p>
        <button id="btn-resume" class="btn btn-primary" type="button">이어하기</button>
        <button id="btn-home-pause" class="btn btn-ghost" type="button">홈으로 이동</button>
      </div>
    </section>

    <!-- 종료 확인 -->
    <section id="screen-exit" class="screen is-hidden">
      <div class="panel panel-sm">
        <h2 class="panel-title">게임을 종료할까요?</h2>
        <p class="panel-desc">진행 중인 판은 저장되지 않아요.</p>
        <button id="btn-exit-cancel" class="btn btn-primary" type="button">계속하기</button>
        <button id="btn-exit-confirm" class="btn btn-quiet" type="button">종료하기</button>
      </div>
    </section>

    <!-- ── 상점 ─────────────────────────────── -->
    <section id="screen-shop" class="screen is-hidden">
      <div class="panel panel-wide no-bar">
        <div class="sheet-head">
          <h2 class="panel-title">상점</h2>
          <span class="wallet" id="shop-wallet">0</span>
        </div>
        <p class="panel-desc">보석을 모아 우주선을 바꿔보세요. 성능 차이는 없어요, 순전히 취향이에요.</p>
        <div id="shop-list" class="shop-list"></div>
        <button id="btn-shop-close" class="btn btn-primary" type="button">닫기</button>
      </div>
    </section>

    <!-- ── 랭킹 대시보드 ────────────────────── -->
    <section id="screen-rank" class="screen is-hidden">
      <div class="panel panel-wide no-bar">
        <div class="sheet-head">
          <h2 class="panel-title">랭킹</h2>
          <span id="rank-mine" class="rank-mine"></span>
        </div>
        <div id="rank-list" class="rank-list no-bar"></div>
        <button id="btn-rank-toss" class="btn btn-ghost is-hidden" type="button">토스 게임센터 랭킹</button>
        <button id="btn-rank-close" class="btn btn-primary" type="button">닫기</button>
      </div>
    </section>

    <!-- ── 설정 ─────────────────────────────── -->
    <section id="screen-settings" class="screen is-hidden">
      <div class="panel panel-wide no-bar">
        <h2 class="panel-title">설정</h2>

        <div class="field">
          <label class="field-label" for="input-nick">닉네임</label>
          <div class="field-row">
            <input id="input-nick" class="input" type="text" maxlength="12"
                   autocomplete="off" autocapitalize="off" spellcheck="false"
                   placeholder="우주미아0000" />
            <button id="btn-nick-save" class="btn btn-inline" type="button">저장</button>
          </div>
          <p id="nick-msg" class="field-msg">한글·영문·숫자 2~12글자. 랭킹에 이 이름으로 올라가요.</p>
        </div>

        <div class="field">
          <span class="field-label">소리</span>
          <label class="switch">
            <span>효과음</span>
            <input id="sw-sfx" type="checkbox" checked />
            <span class="track" aria-hidden="true"><span class="knob"></span></span>
          </label>
          <label class="switch">
            <span>배경음</span>
            <input id="sw-bgm" type="checkbox" checked />
            <span class="track" aria-hidden="true"><span class="knob"></span></span>
          </label>
          <label class="switch">
            <span>진동</span>
            <input id="sw-haptic" type="checkbox" checked />
            <span class="track" aria-hidden="true"><span class="knob"></span></span>
          </label>
        </div>

        <div class="field">
          <label class="field-label" for="range-vol">
            전체 볼륨 <b id="vol-value">80%</b>
          </label>
          <input id="range-vol" class="range" type="range" min="0" max="100" step="5" value="80" />
        </div>

        <p id="sync-msg" class="field-msg"></p>
        <button id="btn-settings-close" class="btn btn-primary" type="button">닫기</button>
      </div>
    </section>

    <!-- 광고 로딩 등 짧은 대기 -->
    <div id="toast" class="toast is-hidden"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
